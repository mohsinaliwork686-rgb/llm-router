# A full example: Claude through the Anthropic API, plus a free local model through Ollama.
# Prices are US dollars per million tokens and belong to whoever runs the router. Check them
# against your provider's price page; the router never assumes a price it was not given.

providers:
  anthropic:
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
  local:
    type: openai_compatible          # Ollama, vLLM, LM Studio, and most hosted providers
    base_url: http://localhost:11434/v1

models:
  llama:
    provider: local
    model: llama3.1:8b
    input_per_million: 0
    output_per_million: 0
    max_output_tokens: 4096
  haiku:
    provider: anthropic
    model: claude-haiku-4-5
    input_per_million: 1.00
    output_per_million: 5.00
    max_output_tokens: 8192
  sonnet:
    provider: anthropic
    model: claude-sonnet-5-5
    input_per_million: 2.00
    output_per_million: 10.00
    max_output_tokens: 16000
    drop_sampling_params: true       # current Claude models refuse temperature and top_p
  opus:
    provider: anthropic
    model: claude-opus-5-5
    input_per_million: 4.00
    output_per_million: 20.00
    max_output_tokens: 16000
    drop_sampling_params: true

policies:
  cheap: [llama, haiku]
  balanced: [sonnet, haiku]
  best: [opus, sonnet]
  long-context: [sonnet, opus]       # both take a million tokens of context

rules:                               # for model="auto"; first match wins
  - when: { tag: urgent }
    use: best
  - when: { prompt_tokens_over: 150000 }
    use: long-context
  - when: { prompt_tokens_under: 500 }
    use: cheap
default_policy: balanced

budget:
  daily_usd: 25.00                   # across every client
  on_exceeded: reject
  timezone: UTC

clients:                             # leave out to run open, for local use
  - name: billing-app
    key_env: ROUTER_KEY_BILLING
    daily_usd: 5.00                  # a cap for this client inside the global one
  - name: support-bot
    key_env: ROUTER_KEY_SUPPORT

retry:
  attempts_per_model: 2
  backoff_ms: 200
  timeout_seconds: 60
